<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株式会社IIKA | ホームページ全面リニューアル中のお知らせ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="現在、弊社ホームページは全面リニューアルを実施しております。より充実した情報と快適な閲覧環境をご提供できるよう、内容の見直しと改善を進めております。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
	font-family: "Canva Sans", "Microsoft YaHei", "ヒラギノ丸ゴ Pro", "Hiragino Maru Gothic Pro", "メイリオ", Meiryo, Osaka, "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
	-webkit-text-size-adjust: none;
	background: #fff;
	color: #333;
	line-height: 2;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}
.l-header { border-top: 5px solid #4D438E; }
.l-header__container {
	margin: 0 auto;
	padding: 0 46px;
	max-width: 1200px;
	width: 100%;
	box-sizing: border-box;
	display: flex;
	align-items: center;
	justify-content: space-between;
	min-height: 96px;
}
.l-header .logo img { width: auto; height: 54px; vertical-align: middle; }
.lang .linkList { list-style: none; display: flex; gap: 14px; }
.lang .linkList a {
	color: #999;
	text-decoration: none;
	font-family: 'Barlow Condensed', sans-serif;
	letter-spacing: 1px;
	font-size: 16px;
	line-height: 2;
}
.lang .linkList li.current a { color: #4D438E; font-weight: 700; }
.lang .linkList a:hover { color: #54adf1; }

#contents {
	flex: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 60px 20px;
	background:
		radial-gradient(circle at 15% 20%, rgba(84, 173, 241, 0.08), transparent 45%),
		radial-gradient(circle at 85% 80%, rgba(77, 67, 142, 0.08), transparent 45%),
		#fff;
}
.maintenance {
	max-width: 640px;
	width: 100%;
	text-align: center;
}
.spinner {
	width: 64px;
	height: 64px;
	margin: 0 auto 32px;
	border-radius: 50%;
	border: 5px solid #E0DFE7;
	border-top-color: #4D438E;
	border-right-color: #54adf1;
	animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.maintenance h1 {
	font-size: 28px;
	line-height: 1.6;
	color: #4D438E;
	font-weight: 700;
	letter-spacing: 0.06em;
	margin-bottom: 20px;
}
.maintenance .lead {
	font-size: 16px;
	color: #333;
	margin-bottom: 6px;
}
.maintenance .sub {
	font-size: 14px;
	color: #999;
}
.divider {
	width: 64px;
	height: 3px;
	background: linear-gradient(90deg, #4D438E, #54adf1);
	margin: 32px auto;
	border-radius: 2px;
}
.reload {
	display: inline-block;
	margin-top: 28px;
	padding: 12px 40px;
	background: #4D438E;
	color: #fff;
	text-decoration: none;
	font-size: 15px;
	letter-spacing: 0.08em;
	border-radius: 4px;
	transition: background 0.25s ease;
}
.reload:hover { background: #54adf1; }

.l-footer {
	background: #f7f7f7;
	color: #999;
	text-align: center;
	font-size: 12px;
	letter-spacing: 0.06em;
	padding: 18px 20px;
}
@media (max-width: 640px) {
	.l-header__container { padding: 0 20px; min-height: 80px; }
	.l-header .logo img { height: 42px; }
	.maintenance h1 { font-size: 21px; }
	.maintenance .lead { font-size: 14px; }
}
</style>
</head>

<body>

<header class="l-header">
	<div class="l-header__container">
		<h1 class="logo"><a href="/"><img src="images/new/A2.png" alt="株式会社IIKA"></a></h1>
		<div class="lang">
			<ul class="linkList">
				<li class="current"><a href="/" lang="jp">JP</a></li>
				<li><a href="/index-en" lang="en">EN</a></li>
				<li><a href="/index-cn">CN</a></li>
			</ul>
		</div>
	</div>
</header>

<div id="contents">
	<div class="maintenance">
		<div class="spinner"></div>
		<h1>ホームページ全面リニューアル中のお知らせ</h1>
		<p class="lead">現在、弊社ホームページは全面リニューアルを実施しております。</p>
		<p class="sub">より充実した情報と快適な閲覧環境をご提供できるよう、内容の見直しと改善を進めております。</p>
		<div class="divider"></div>
		<p class="sub">ご不便をおかけいたしますが、何卒ご理解のほどよろしくお願い申し上げます。</p>
		<a class="reload" href="/">再読み込み</a>
	</div>
</div>

<footer class="l-footer">
	&copy; IIKA Co., Ltd. All Rights Reserved.
</footer>

</body>
</html>
